name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, web-build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/madro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/madro/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test regelmotoren
        run: npm test
      - name: Byg web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci

  functions:
    name: Edge-funktioner (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions

  database:
    name: Database (migrationer og rækkesikkerhed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start lokal Supabase
        run: supabase db start
      - name: Test rækkesikkerhed
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -o /dev/null -f supabase/tests/rls.sql
      - name: Test madplan
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -o /dev/null -f supabase/tests/madplan.sql
      - name: Test indkøb
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -o /dev/null -f supabase/tests/indkob.sql
      - name: Test køkken og økonomi
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -o /dev/null -f supabase/tests/oekonomi.sql
      - name: Startkataloget er bygget ud fra rettelisten
        run: python3 supabase/catalog/build.py && git diff --exit-code supabase/
