name: Udrul database

# Kører, når migrationer eller Supabase-opsætning ændres på main.
# Kræver hemmelighederne SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF og SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths:
      - supabase/**
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Spring over, hvis Supabase ikke er sat op endnu
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "Supabase-hemmelighederne mangler. Springer udrulning over."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.ok == 'true'
        with:
          version: latest
      - if: steps.ready.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Migrationer
        if: steps.ready.outputs.ok == 'true'
        run: supabase db push
      - name: Login-opsætning og mailskabeloner
        if: steps.ready.outputs.ok == 'true'
        run: supabase config push --project-ref "$PROJECT_REF" --yes
