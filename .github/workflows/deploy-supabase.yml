name: Udrul database

# Kører, når migrationer eller Supabase-opsætning ændres på main.
# Kræver hemmelighederne SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF og SUPABASE_DB_PASSWORD.
# ANTHROPIC_API_KEY lægges som hemmelighed i Supabase til kvitteringslæsningen, hvis den findes.
on:
  push:
    branches: [main]
    paths:
      - supabase/**
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Miljøet "production" kræver godkendelse af en udvikler, før job'et må køre.
    # Opsættes under repoets Settings → Environments med required reviewers.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Spring over, hvis Supabase ikke er sat op endnu
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "Supabase-hemmelighederne mangler. Springer udrulning over."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.ok == 'true'
        with:
          version: 2.121.0
      - if: steps.ready.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Vis migrationer, der afventer
        if: steps.ready.outputs.ok == 'true'
        run: supabase db push --dry-run
      - name: Migrationer
        if: steps.ready.outputs.ok == 'true'
        run: supabase db push
      - name: Login-opsætning og mailskabeloner
        if: steps.ready.outputs.ok == 'true'
        run: supabase config push --project-ref "$PROJECT_REF" --yes
      # Nøglen skrives til en midlertidig fil, så den ikke står i kommandolinjen eller loggen.
      - name: Nøgle til kvitteringslæsning
        if: steps.ready.outputs.ok == 'true' && env.ANTHROPIC_API_KEY != ''
        run: |
          umask 077
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > "$RUNNER_TEMP/secrets.env"
          supabase secrets set --env-file "$RUNNER_TEMP/secrets.env" --project-ref "$PROJECT_REF"
          rm "$RUNNER_TEMP/secrets.env"
      - name: Edge-funktioner
        if: steps.ready.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
