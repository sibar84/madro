# Den offentlige side, prototypen, pitchen og logoerne udgives som før.
# Webversionen af appen bygges fra apps/madro og ligger under /app/.
# Appens kildekode og databasen bliver i det private repository.
[build]
  command = "sh scripts/netlify-build.sh"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# En kodefil, der ikke findes (fx fra en ældre udgave), skal give 404 og ikke index.html.
[[redirects]]
  from = "/app/_expo/*"
  to = "/404.html"
  status = 404

# Appen styrer selv sine adresser, så alle undersider under /app/ får index.html.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200
