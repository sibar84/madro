<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madro</title>
<link rel="icon" href="brand/logo/madro-app-ikon-lys.png">
<style>
:root{--bg:#F3EEE4;--ink:#2B1D17;--card:#E9D8C4;--beet:#8E1B42}
@media (prefers-color-scheme:dark){:root{--bg:#1C1410;--ink:#F3EEE4;--card:#2B1D17;--beet:#E8789A}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{width:min(420px,100% - 32px);text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{margin:16px 0 4px;font-size:28px}
p{margin:0 0 28px;opacity:.8}
a{display:block;margin:12px 0;padding:16px;border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600}
a.primary{background:var(--beet);color:var(--bg)}
</style>
</head>
<body>
<main>
<img src="brand/logo/madro-app-ikon-lys.png" alt="">
<h1>Madro</h1>
<p>Fredag morgen ved I, hvad I skal spise hele ugen.</p>
<a class="primary" href="prototype/">Åbn prototypen</a>
<a href="pitch/">Se pitchen</a>
</main>
</body>
</html>
